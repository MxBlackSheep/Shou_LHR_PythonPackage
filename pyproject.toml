[project]
name = "hamilton-lab-workflows"
version = "0.1.0"
description = "Python utilities for Hamilton VENUS laboratory workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2.3,<3",
    "pyodbc>=5.2,<6",
    "pyserial>=3.5,<4",
    "requests>=2.32.4,<3",
    # The experiment setup dialogs also accept legacy .xls workbooks.
    "xlrd>=2.0.1,<3",
]

[dependency-groups]
dev = ["pyinstaller>=6.11,<7"]

[tool.uv]
# These are standalone scripts, not yet an installable shared package.
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
